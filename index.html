.dial-inner{

button{

button:hover:not(:disabled){

button.primary{

button:disabled{

input[type=number]{

input[type=text],textarea{

textarea{resize:vertical}

label{font-size:14px}

input[type=range]{

input[type=checkbox]{

// ========================================
// 5. 动态鼓励语系统
// ========================================

let kind = 'daily';

let lastQuote = '';

function encourage(k = kind){

    kind = k;

    const pool = quotes[k] || quotes.daily;

    const choices = pool.filter(
        q => q !== lastQuote
    );

    lastQuote = choices[
        Math.floor(
            Math.random()*choices.length
        )
    ];

    $('quote').textContent = lastQuote;

    $('quoteKind').textContent = ({

        daily:'每日鼓励',

        focus:'专注与研究',

        pause:'调整节奏',

        rest:'温柔休息',

        done:'完成鼓励',

        milestone:'成长里程碑'

    })[k];

}

$('nextQuote').onclick = () => encourage();

encourage();

let lastState = '';

let lastMilestone = null;


// ========================================
// 6. 声音设置储存
// ========================================

function pref(k,v){

    try{

        return localStorage.getItem(k) ?? v;

    }catch{

        return v;

    }

}

function savePref(k,v){

    try{

        localStorage.setItem(k,v);

    }catch{}

}

$('soundEnabled').checked =

    pref(
        'readingSoundEnabled',
        'true'
    ) !== 'false';

$('soundVolume').value =

    pref(
        'readingSoundVolume',
        '35'
    );

$('volumeText').textContent =

    $('soundVolume').value + '%';

let ctx;

let master;


// ========================================
// 7. 温和轻音乐系统
// ========================================

async function unlock(){

    try{

        ctx = ctx || new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

        if(ctx.state !== 'running'){

            await ctx.resume();

        }

        return ctx.state === 'running';

    }catch{

        return false;

    }

}


function stop(){

    if(master && ctx){

        master.gain.setTargetAtTime(
            0,
            ctx.currentTime,
            .04
        );

        master = null;

    }

}


async function music(preview = false){

    if(
        !preview &&
        !$('soundEnabled').checked
    ){

        return;

    }

    if(!await unlock()){

        $('soundMessage').textContent =
            '请点击试听以启用声音。';

        return;

    }

    stop();

    const out = ctx.createGain();

    master = out;

    out.gain.value =
        +$('soundVolume').value/100*.45;

    out.connect(ctx.destination);

    const now = ctx.currentTime;


    // 柔和音符

    function note(f,t,len,v){

        const o = ctx.createOscillator();

        const g = ctx.createGain();

        o.type = 'sine';

        o.frequency.value = f;

        o.connect(g);

        g.connect(out);

        const s = now+t;

        g.gain.setValueAtTime(
            .0001,
            s
        );

        g.gain.exponentialRampToValueAtTime(
            v,
            s+.12
        );

        g.gain.exponentialRampToValueAtTime(
            v*.32,
            s+.45
        );

        g.gain.exponentialRampToValueAtTime(
            .0001,
            s+len
        );

        o.start(s);

        o.stop(s+len+.05);

        o.onended = () => {

            o.disconnect();

            g.disconnect();

        };

    }


    // 原创主旋律

    [

        [261.63,0,1.8],

        [329.63,.65,1.8],

        [392,1.3,2],

        [523.25,2.1,2.2],

        [440,3,1.8],

        [392,3.8,1.8],

        [329.63,4.6,2],

        [261.63,5.5,2.5]

    ].forEach(n => note(...n,.32));


    // 低音伴奏

    [

        [130.81,0,3.5],

        [196,2.1,3.5],

        [174.61,3.8,3],

        [130.81,5.5,2.5]

    ].forEach(n => note(...n,.1));


    $('soundMessage').textContent =

        preview
        ? '正在试听……'
        : '计时结束！';


    // 音乐播放结束

    setTimeout(() => {

        out.disconnect();

        if(master === out){

            master = null;

            $('soundMessage').textContent =
                '倒计时结束后播放柔和旋律。';

        }

    },8500);

}

const elapsed = (x,n=Date.now()) =>

    Math.min(

        duration(x),

        x.elapsed + (

            x.since == null

            ? 0

            : Math.max(
                0,
                (n-x.since)/1000
            )

        )

    );


// ========================================
// 9. 阅读记录结算
// ========================================

function settle(x,n,force=false){

    let e = Math.floor(
        elapsed(x,n)
    );

    if(

        !force &&

        !(

            x.since !== null &&

            e >= duration(x)

        )

    ){

        return false;

    }

    if(x.mode === 'focus' && e>0){

        x.logs.push({

            id:crypto.randomUUID(),

            date:x.since === null

                ? n

                : Math.min(

                    n,

                    x.since +

                    (duration(x)-x.elapsed)*1000

                ),

            seconds:e,

            paper:x.paper,

            notes:x.notes

        });

    }

    x.elapsed = 0;

    x.since = null;

    return true;

}


// ========================================
// 10. Firebase 云端事务
// ========================================

async function change(fn){

    if(

        !ready ||

        busy ||

        !ref ||

        !navigator.onLine

    ){

        return false;

    }

    busy = true;

    try{

        const target = ref;

        await runTransaction(

            db,

            async t => {

                const s = await t.get(target);

                let x = s.exists()

                    ? s.data()

                    : fresh();

                let n = Date.now();

                settle(x,n);

                fn(x,n);

                t.set(target,x);

            }

        );

        return true;

    }catch(e){

        alert(
            '同步失败：'+e.message
        );

        return false;

    }finally{

        busy = false;

        tick();

    }

}


// ========================================
// 11. 时间格式化
// ========================================

function fmt(s){

    s = Math.max(
        0,
        Math.floor(s)
    );

    return Math.floor(s/3600)

        +'小时 '

        +Math.floor(s%3600/60)

        +'分 '

        +s%60

        +'秒';

}


function clock(s){

    s = Math.max(
        0,
        Math.ceil(s)
    );

    return String(

        Math.floor(s/60)

    ).padStart(2,'0')

    +':'+

    String(

        s%60

    ).padStart(2,'0');

}


// ========================================
// 12. 计时结束提醒
// ========================================

function alarm(t){

    if(alarmKey === t.key){

        return;

    }

    alarmKey = t.key;

    completedMode = t.mode;

    completedUntil = Date.now()+60000;

    music();

}


// ========================================
// 13. 核心计时系统
// ========================================

function tick(){

    let e = elapsed(d);

    let r = Math.ceil(
        duration(d)-e
    );

    let live = d.mode === 'focus'

        ? Math.floor(e)

        : 0;

    let saved = d.logs.reduce(
        (a,l)=>a+l.seconds,
        0
    );

    let total = saved+live;

    let n = Date.now();


    // 检查倒计时是否结束

    if(ready){

        if(d.since !== null){

            watched = {

                key:d.mode+'-'+d.since,

                mode:d.mode,

                end:d.since+

                    (duration(d)-d.elapsed)*1000

            };

            if(n >= watched.end){

                alarm(watched);

            }

        }else if(watched){

            if(

                n >= watched.end &&

                n-watched.end < 60000 &&

                d.elapsed === 0

            ){

                alarm(watched);

            }

            watched = null;

        }

    }


    // 根据学习状态自动切换鼓励语

    let state = !ready

        ? 'daily'

        : d.since !== null && r>0

        ? d.mode

        : n<completedUntil

        ? (
            completedMode === 'focus'
            ? 'done'
            : 'rest'
        )

        : e>0

        ? 'pause'

        : 'daily';


    if(state !== lastState){

        lastState = state;

        encourage(state);

    }


    // 更新环形倒计时

    $('clock').textContent = clock(r);

    $('dial').style.setProperty(

        '--progress',

        360*e/duration(d)+'deg'

    );

    $('modeLabel').textContent =

        d.mode === 'focus'

        ? '专注阅读'

        : '放松休息';


    // 更新100小时进度

    $('left').textContent =

        fmt(GOAL-total);

    $('total').textContent =

        fmt(total);

    $('percent').textContent =

        (total/GOAL*100).toFixed(2)+'%';

    $('bar').style.width =

        Math.min(

            100,

            total/GOAL*100

        )+'%';


    // 成长里程碑

    let marks = [

        1,5,10,25,50,75,100

    ];

    let level = marks.filter(

        h => saved >= h*3600

    ).length;


    if(

        ready &&

        lastMilestone !== null &&

        level > lastMilestone

    ){

        encourage('milestone');

    }

    if(ready){

        lastMilestone = level;

    }


    $('milestones').replaceChildren(

        ...marks.map(h => {

            let s = document.createElement('span');

            s.className =

                saved >= h*3600

                ? 'earned'

                : '';

            s.textContent =

                (

                    saved >= h*3600

                    ? '✓ '

                    : '○ '

                ) + h + ' 小时';

            return s;

        })

    );


    // 今日、本周、本月统计

    let day = new Date();

    day.setHours(0,0,0,0);

    let week = new Date(day);

    week.setDate(

        week.getDate() -

        (week.getDay()+6)%7

    );

    let month = new Date(day);

    month.setDate(1);


    for(

        const [k,t,label] of [

            ['today',day,'今日'],

            ['week',week,'本周'],

            ['month',month,'本月']

        ]

    ){

        $(k).textContent =

            label+' '+

            fmt(

                d.logs.filter(

                    l => l.date >= +t

                ).reduce(

                    (a,l)=>a+l.seconds,

                    0

                )+live

            );

    }


    // 按钮控制

    let lock =

        !ready ||

        busy ||

        !navigator.onLine;


    for(

        const k of [

            'focus',

            'rest',

            'saveNotes',

            'import'

        ]

    ){

        $(k).disabled = lock;

    }


    $('start').disabled =

        lock || d.since !== null;

    $('pause').disabled =

        lock || d.since === null;

    $('finish').disabled =

        lock || e<=0;

    $('focusMin').disabled =

    $('restMin').disabled =

        lock || e>0 || d.since !== null;


    $('start').textContent =

        e>0 ? '继续' : '开始';


    $('focus').className =

        d.mode === 'focus'

        ? 'primary'

        : '';


    $('rest').className =

        d.mode === 'rest'

        ? 'primary'

        : '';


    // 计时状态

    let done = n<completedUntil;

    let running =

        d.since !== null && r>0;

    let status = running

        ? '计时中'

        : done

        ? (

            completedMode === 'focus'

            ? '阅读完成！'

            : '休息结束！'

        )

        : e>0

        ? '已暂停'

        : '准备开始';


    $('status').textContent =

        !ready

        ? '等待云端连接'

        : !navigator.onLine

        ? '离线 · 只读'

        : status;


    // 浏览器分页标签倒计时

    document.title =

        !ready

        ? TITLE

        : running

        ? clock(r)+' - '+(

            d.mode === 'focus'

            ? '论文阅读中'

            : '休息中'

        )

        : done

        ? status+' - 100小时挑战'

        : e>0

        ? clock(r)+' - 已暂停'

        : TITLE;


    // 自动保存完成的阅读记录

    if(

        !lock &&

        d.since !== null &&

        e >= duration(d)

    ){

        change(()=>{});

    }

}


// ========================================
// 14. 阅读历史记录
// ========================================

function history(){

    let h = $('history');

    h.replaceChildren();

    if(!d.logs.length){

        h.textContent = '暂无记录';

    }

    for(

        const l of [...d.logs].reverse()

    ){

        let e = document.createElement('div');

        e.className = 'entry';

        for(

            const v of [

                l.paper || '未命名论文',

                new Date(l.date).toLocaleString()

                    +' · '+fmt(l.seconds),

                l.notes || ''

            ]

        ){

            let p = document.createElement('p');

            p.textContent = v;

            e.append(p);

        }


        let b = document.createElement('button');

        b.textContent = '删除';

        b.onclick = () => {

            if(confirm('删除此记录？')){

                change(x => {

                    x.logs = x.logs.filter(

                        a => a.id !== l.id

                    );

                });

            }

        };

        e.append(b);

        h.append(e);

    }

}


// ========================================
// 15. 页面渲染
// ========================================

function render(){

    $('focusMin').value = d.focus;

    $('restMin').value = d.rest;

    if(!dirty){

        $('paper').value = d.paper;

        $('notes').value = d.notes;

    }

    history();

    tick();

}


// ========================================
// 16. Firebase 登入及同步
// ========================================

try{

    let app = initializeApp(firebaseConfig);

    auth = getAuth(app);

    db = getFirestore(app);


    // Google 登入

    $('login').onclick = () => {

        unlock();

        signInWithPopup(

            auth,

            new GoogleAuthProvider()

        ).catch(

            e => alert(e.message)

        );

    };


    // 登出

    $('logout').onclick = () => signOut(auth);


    // 监听登入状态

    onAuthStateChanged(auth,u => {

        unsub?.();

        ready = false;

        dirty = false;

        ref = null;

        d = fresh();

        watched = null;

        alarmKey = '';

        completedUntil = 0;

        lastMilestone = null;

        stop();

        render();


        $('login').disabled = !!u;

        $('logout').disabled = !u;


        $('cloud').textContent =

            u

            ? '连接中：'+u.email

            : '尚未登入';


        if(!u) return;


        // 连接原本的数据库

        ref = doc(

            db,

            'users',

            u.uid

        );


        // 实时同步云端数据

        unsub = onSnapshot(

            ref,

            {includeMetadataChanges:true},

            s => {

                d = s.exists()

                    ? s.data()

                    : fresh();

                ready = !s.metadata.fromCache;

                $('cloud').textContent =

                    ready

                    ? '云端已连接：'+u.email

                    : '等待服务器连接';

                render();

            },

            e => {

                $('cloud').textContent = e.message;

                ready = false;

                tick();

            }

        );

    });

}catch(e){

    $('cloud').textContent = e.message;

    $('login').disabled = true;

}


// ========================================
// 17. 阅读心得储存
// ========================================

for(

    const k of ['paper','notes']

){

    $(k).oninput = () => dirty = true;

}


function draft(x){

    if(dirty){

        x.paper = $('paper').value;

        x.notes = $('notes').value;

    }

}


$('saveNotes').onclick = async () => {

    let p = $('paper').value;

    let n = $('notes').value;


    if(

        await change(x => {

            x.paper = p;

            x.notes = n;

        })

        && $('paper').value === p

        && $('notes').value === n

    ){

        dirty = false;

    }

};


// ========================================
// 18. 开始、暂停、结束
// ========================================

// 开始阅读

$('start').onclick = () => {

    unlock();

    completedUntil = 0;

    change((x,n) => {

        draft(x);

        if(x.since === null){

            x.since = n;

        }

    });

};


// 暂停阅读

$('pause').onclick = () =>

    change((x,n) => {

        draft(x);

        x.elapsed = elapsed(x,n);

        x.since = null;

    });


// 结束并保存

$('finish').onclick = async () => {

    if(

        await change((x,n) => {

            draft(x);

            settle(x,n,true);

        })

    ){

        completedMode = d.mode;

        completedUntil = Date.now()+60000;

        tick();

    }

};


// ========================================
// 19. 阅读与休息模式
// ========================================

for(

    const k of ['focus','rest']

){

    $(k).onclick = () => {

        completedUntil = 0;

        change((x,n) => {

            if(

                x.mode !== k &&

                elapsed(x,n) === 0

            ){

                x.mode = k;

            }

        });

    };


    // 修改计时时间

    $(k+'Min').onchange = () => {

        let v = Math.max(

            1,

            Math.min(

                +$(k+'Min').max,

                Math.round(

                    +$(k+'Min').value || 1

                )

            )

        );


        change(x => {

            if(

                elapsed(x) === 0 &&

                x.since === null

            ){

                x[k] = v;

            }

        });

    };

}


// ========================================
// 20. 导出阅读备份
// ========================================

$('export').onclick = () => {

    let a = document.createElement('a');

    let url = URL.createObjectURL(

        new Blob(

            [JSON.stringify(d)],

            {type:'application/json'}

        )

    );

    a.href = url;

    a.download = 'reading-backup.json';

    a.click();

    setTimeout(

        () => URL.revokeObjectURL(url),

        1000

    );

};


// ========================================
// 21. 导入阅读备份
// ========================================

$('import').onclick = () =>

    $('file').click();


$('file').onchange = async () => {

    try{

        if(!$('file').files.length){

            return;

        }

        let x = JSON.parse(

            await $('file').files[0].text()

        );


        if(

            !Array.isArray(x.logs)

            ||

            !x.logs.every(l =>

                typeof l.id === 'string'

                && Number.isFinite(l.seconds)

                && l.seconds >= 0

                && Number.isFinite(l.date)

            )

        ){

            throw Error('无效备份');

        }


        if(confirm('合并备份记录？')){

            await change(y => {

                let ids = new Set(

                    y.logs.map(l => l.id)

                );

                for(const l of x.logs){

                    if(!ids.has(l.id)){

                        y.logs.push(l);

                        ids.add(l.id);

                    }

                }

            });

        }

    }catch(e){

        alert(e.message);

    }finally{

        $('file').value = '';

    }

};


// ========================================
// 22. 后台分页及网络监听
// ========================================

for(

    const event of [

        'focus',

        'online',

        'offline'

    ]

){

    window.addEventListener(

        event,

        tick

    );

}


document.addEventListener(

    'visibilitychange',

    tick

);


// ========================================
// 23. 启动系统
// ========================================

render();

setInterval(tick,500);

</script>

</body>
</html>
